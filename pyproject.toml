[project]
name = "aleph-mcp"
dynamic = ["version"]
description = "Read-only MCP server that wraps the OCCRP Aleph REST API for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vlad Styran", email = "sapran@gmail.com" }]
license = { text = "MIT" }
keywords = ["mcp", "aleph", "occrp", "followthemoney", "osint", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3,<4",
    # The read-only guard is an httpx request event hook; keep the major version bounded
    # so hook semantics cannot change under a routine upgrade (see src/aleph_mcp/readonly.py).
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
]

[project.urls]
Homepage = "https://github.com/sapran/aleph-mcp"
Repository = "https://github.com/sapran/aleph-mcp"
Issues = "https://github.com/sapran/aleph-mcp/issues"

[project.scripts]
aleph-mcp = "aleph_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aleph_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["live: hits a real Aleph instance (gated by ALEPH_MCP_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["aleph_mcp"]
strict = true
mypy_path = "src"

version: 2

updates:
  # Keeps the full-SHA pins in .github/workflows/ci.yml current. Pinning to a SHA is
  # what makes a third-party action immutable; without this the pins simply rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # A freshly published version is the one most likely to be a hijacked release, so
    # let it age before adopting it. Cooldown applies to version updates only —
    # Dependabot security updates are never delayed by it.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Reviewer instruction, not a control this file enforces: `update-types` above limits
    # what gets *grouped*, so Dependabot can still open a standalone PR widening the
    # httpx bound. httpx is pinned <1 in pyproject.toml because the read-only guard is an
    # httpx request event hook, so treat any httpx major as a security change needing the
    # guard re-verified — never as a routine upgrade. See src/aleph_mcp/readonly.py.
